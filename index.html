<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My record collection</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f4f0;--bg3:#eeecea;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9e9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--radius:8px;--radius-lg:12px;--red:#e24b4a;--green:#4caf50;--amber:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0efea;--text2:#a0a09a;--text3:#6a6a65;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-0.02em}
.logo svg{width:20px;height:20px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.page{max-width:1100px;margin:0 auto;padding:1.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.5rem}
.stat{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:1rem}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px}
.stat-val{font-size:24px;font-weight:600;color:var(--text);letter-spacing:-0.02em}
.controls{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none}
input,select{height:36px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit;padding:0 12px;outline:none;width:100%;transition:border-color 0.15s}
input:focus,select:focus{border-color:var(--text2)}
.search-wrap input{padding-left:32px}
select{cursor:pointer;width:auto;min-width:130px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--radius);font-size:14px;font-family:inherit;cursor:pointer;border:none;white-space:nowrap;transition:opacity 0.15s}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{opacity:.82}
.btn-ghost{background:transparent;color:var(--text2);border:0.5px solid var(--border2)}
.btn-ghost:hover{background:var(--bg2);color:var(--text)}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn-scan{background:var(--bg3);color:var(--text);border:0.5px solid var(--border2)}
.btn-scan:hover{background:var(--bg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.15s,transform 0.15s}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.art-wrap{width:100%;aspect-ratio:1;overflow:hidden;background:var(--bg3);position:relative}
.art-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.art-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;letter-spacing:-0.02em}
.art-spinner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card-body{padding:.875rem;flex:1;display:flex;flex-direction:column;gap:5px}
.card-artist{font-size:12px;color:var(--text2)}
.card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10px;padding:2px 7px;border-radius:100px;border:0.5px solid var(--border);color:var(--text2)}
.card-notes{font-size:11px;color:var(--text3);line-height:1.4;margin-top:2px}
.card-links{display:flex;gap:5px;margin-top:auto;padding-top:10px;border-top:0.5px solid var(--border);align-items:center;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text2);text-decoration:none;padding:3px 7px;border-radius:5px;border:0.5px solid var(--border);background:none;cursor:pointer;transition:border-color 0.12s,color 0.12s;white-space:nowrap;font-family:inherit}
.link-btn:hover{border-color:var(--border2);color:var(--text)}
.link-btn svg{width:11px;height:11px;flex-shrink:0}
.del-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;padding:3px;border-radius:4px;transition:color 0.12s}
.del-btn:hover{color:var(--red)}
.del-btn svg{width:14px;height:14px}
.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text2);font-size:14px}
.empty svg{width:36px;height:36px;display:block;margin:0 auto 12px;opacity:.3}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:1.75rem;width:100%;max-width:480px}
.modal h2{font-size:18px;font-weight:600;margin-bottom:1.25rem;letter-spacing:-0.01em}
.form-row{margin-bottom:11px}
.form-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.form-row input,.form-row select{width:100%}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:0.5px solid var(--border)}
.input-row{display:flex;gap:8px}
.input-row input{flex:1}
.preview-box{border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.25rem;display:none}
.preview-box.visible{display:block}
.preview-results{max-height:260px;overflow-y:auto}
.preview-item{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;border-bottom:0.5px solid var(--border);transition:background 0.12s}
.preview-item:last-child{border-bottom:none}
.preview-item:hover{background:var(--bg2)}
.preview-item.selected{background:var(--bg3)}
.preview-art{width:46px;height:46px;border-radius:6px;object-fit:cover;flex-shrink:0}
.preview-art-placeholder{width:46px;height:46px;border-radius:6px;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.preview-info{flex:1;min-width:0}
.preview-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-sub{font-size:12px;color:var(--text2)}
.preview-meta{font-size:11px;color:var(--text3);margin-top:1px}
.preview-check{width:18px;height:18px;border-radius:50%;background:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity 0.12s}
.preview-item.selected .preview-check{opacity:1}
.preview-check svg{width:10px;height:10px;stroke:var(--bg)}
.msg{padding:.875rem 1rem;text-align:center;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:8px}
.divider{display:flex;align-items:center;gap:10px;margin:1rem 0;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:0.5px;background:var(--border)}
.alert{padding:.75rem 1rem;border-radius:var(--radius);font-size:13px;margin-bottom:1rem;display:none}
.alert.visible{display:flex;align-items:center;gap:8px}
.alert-warn{background:#fff8e1;border:0.5px solid #ffe082;color:#7a5c00}
.alert-warn svg{color:var(--amber);flex-shrink:0}
@media(prefers-color-scheme:dark){.alert-warn{background:#2a2200;border-color:#5a4400;color:#ffd54f}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1.25rem;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.status-dot{width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block;margin-right:6px;flex-shrink:0}
.status-dot.ok{background:var(--green)}
.status-dot.err{background:var(--red)}
.art-upload-area{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:1rem;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;min-height:80px;display:flex;align-items:center;justify-content:center}
.art-upload-area:hover{border-color:var(--text2);background:var(--bg2)}
#art-upload-preview{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text3);font-size:13px}
#art-upload-preview img{width:80px;height:80px;object-fit:cover;border-radius:var(--radius);display:block}
.scanner-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.scanner-overlay.open{display:flex}
.scanner-wrap{position:relative;width:min(320px,90vw);height:min(320px,90vw)}
#scanner-video{width:100%;height:100%;border-radius:var(--radius-lg);overflow:hidden;background:#000}
.scan-frame{position:absolute;inset:0;border-radius:var(--radius-lg);pointer-events:none}
.scan-line{position:absolute;left:10%;right:10%;height:2px;background:rgba(255,255,255,0.7);animation:scanline 2s ease-in-out infinite;border-radius:2px}
@keyframes scanline{0%,100%{top:15%}50%{top:80%}}
.scanner-hint{color:rgba(255,255,255,0.7);font-size:14px;text-align:center;max-width:280px}
.scanner-status{color:#fff;font-size:15px;font-weight:500;min-height:24px;text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5" stroke-dasharray="2 2.2"/></svg>
    Vinyl
  </div>
  <span style="font-size:12px;color:var(--text3);display:flex;align-items:center"><span class="status-dot" id="status-dot"></span><span id="status-text">connecting…</span></span>
  <div class="topbar-right">
    <span id="topbar-count" style="font-size:13px;color:var(--text2)"></span>
    <button class="btn btn-primary" onclick="openModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add LP
    </button>
  </div>
</div>

<div class="page">
  <div class="stats">
    <div class="stat"><div class="stat-label">Total LPs</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">Artists</div><div class="stat-val" id="s-artists">—</div></div>
    <div class="stat"><div class="stat-label">Genres</div><div class="stat-val" id="s-genres">—</div></div>
    <div class="stat"><div class="stat-label">Oldest</div><div class="stat-val" id="s-oldest">—</div></div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search artist or title…" oninput="render()"/>
    </div>
    <select id="filter-genre" onchange="render()"><option value="">All genres</option></select>
    <select id="sort" onchange="render()">
      <option value="artist">Sort: artist A–Z</option>
      <option value="year">Sort: year</option>
      <option value="title">Sort: title A–Z</option>
      <option value="added">Sort: recently added</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modal-heading">Add a record</h2>
    <div id="search-section">
      <div class="alert alert-warn" id="dup-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="dup-msg"></span>
      </div>
      <div class="form-row">
        <label>Search iTunes to auto-fill</label>
        <div class="input-row">
          <input type="text" id="itunes-search" placeholder="Artist + album title…" onkeydown="if(event.key==='Enter')searchItunes()"/>
          <button class="btn btn-ghost btn-sm" onclick="searchItunes()" id="search-btn">Search</button>
          <button class="btn btn-scan btn-sm" onclick="openScanner()" title="Scan barcode">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="4" height="16"/><rect x="8" y="4" width="2" height="16"/><rect x="12" y="4" width="3" height="16"/><rect x="17" y="4" width="2" height="16"/><rect x="21" y="4" width="1" height="16"/></svg>
            Scan
          </button>
        </div>
      </div>
      <div class="preview-box" id="preview-box"><div id="preview-results"></div></div>
      <div class="divider">or fill in manually</div>
    </div>
    <div class="form-row"><label>Artist *</label><input type="text" id="f-artist" placeholder="e.g. Grateful Dead" oninput="checkDuplicate()"/></div>
    <div class="form-row"><label>Album title *</label><input type="text" id="f-title" placeholder="e.g. American Beauty" oninput="checkDuplicate()"/></div>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px">Year</label><input type="number" id="f-year" placeholder="1970" min="1900" max="2099"/></div>
      <div><label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px">Genre</label><input type="text" id="f-genre" list="genre-list" placeholder="Rock, Jazz…"/></div>
    </div>
    <datalist id="genre-list"></datalist>
    <div class="form-row"><label>Label</label><input type="text" id="f-label" placeholder="e.g. Warner Bros."/></div>
    <div class="form-row"><label>Condition</label>
      <select id="f-condition">
        <option value="">— select —</option>
        <option>Mint</option><option>Near Mint</option><option>Very Good+</option>
        <option>Very Good</option><option>Good</option><option>Fair</option>
      </select>
    </div>
    <div class="form-row"><label>Notes</label><input type="text" id="f-notes" placeholder="Optional notes…"/></div>
    <div class="form-row">
      <label>Album cover</label>
      <div class="art-upload-area" onclick="document.getElementById('f-art-file').click()">
        <div id="art-upload-preview">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Tap to upload or take photo</span>
        </div>
      </div>
      <input type="file" id="f-art-file" accept="image/*" style="display:none" onchange="handleArtFile(event)"/>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button type="button" class="btn btn-ghost btn-sm" style="flex:1" onclick="document.getElementById('f-art-file').removeAttribute('capture');document.getElementById('f-art-file').click()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload image
        </button>
        <button type="button" class="btn btn-ghost btn-sm" style="flex:1" onclick="document.getElementById('f-art-file').setAttribute('capture','environment');document.getElementById('f-art-file').click()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Take photo
        </button>
        <button type="button" class="btn btn-ghost btn-sm" id="art-clear-btn" style="display:none" onclick="clearArt()">Clear</button>
      </div>
    </div>
    <input type="hidden" id="f-artwork-url"/>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveRecord()">Save record</button>
    </div>
  </div>
</div>

<div class="scanner-overlay" id="scanner-overlay">
  <div class="scanner-status" id="scanner-status">Point camera at barcode</div>
  <div class="scanner-wrap">
    <div id="scanner-video" style="width:100%;height:100%;border-radius:var(--radius-lg);overflow:hidden;background:#000"></div>
    <div class="scan-frame"><div class="scan-line"></div></div>
  </div>
  <div class="scanner-hint">Hold the record so the barcode fits in the frame</div>
  <button class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,0.3)" onclick="closeScanner()">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<script>
const AT_KEY='patHK7bKT1HDK2kwF.0a39ee37e7eeaaa93bd7857a8942e6419e847629baa54b39064ccc9ddc62ba15';
const AT_BASE='appuSF82dazmDrlxb';
const AT_TABLE='records';
const AT_URL='https://api.airtable.com/v0/'+AT_BASE+'/'+encodeURIComponent(AT_TABLE);
const HEADERS={'Content-Type':'application/json','Authorization':'Bearer '+AT_KEY};

const PALETTE=[['#dff0e8','#1a6645'],['#fde8c8','#7a3d0a'],['#dce8fb','#1a4d8f'],['#fce8e8','#8f1a1a'],['#ebe8fb','#3d1a8f'],['#e8f5e0','#2a6620'],['#fbf0e8','#7a5010'],['#f5e8fb','#6a1a7a'],['#e8fbf5','#1a6655'],['#fbfbe8','#5a5a10']];
function colorFor(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))&0xffff;return PALETTE[h%PALETTE.length];}
function initials(a){return a.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sortKey(a){return a.replace(/^The\s+/i,'');}

// ── Art upload ────────────────────────────────────────────────────────────────
function handleArtFile(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=800;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const resized=canvas.toDataURL('image/jpeg',0.85);
      document.getElementById('f-artwork-url').value=resized;
      document.getElementById('art-upload-preview').innerHTML='<img src="'+resized+'" alt="preview"/>';
      document.getElementById('art-clear-btn').style.display='';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearArt(){
  document.getElementById('f-artwork-url').value='';
  document.getElementById('f-art-file').value='';
  document.getElementById('art-upload-preview').innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Tap to upload or take photo</span>';
  document.getElementById('art-clear-btn').style.display='none';
}
function resetArtUpload(existingUrl){
  document.getElementById('f-art-file').value='';
  if(existingUrl){
    document.getElementById('art-upload-preview').innerHTML='<img src="'+esc(existingUrl)+'" alt="preview"/>';
    document.getElementById('art-clear-btn').style.display='';
  }else{
    document.getElementById('art-upload-preview').innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Tap to upload or take photo</span>';
    document.getElementById('art-clear-btn').style.display='none';
  }
}

// ── Art fetching ──────────────────────────────────────────────────────────────
const artCache={};
async function fetchArt(artist,title){
  const key=artist+'||'+title;
  if(key in artCache)return artCache[key];
  artCache[key]=null;
  try{
    const res=await fetch('/api/itunes?term='+encodeURIComponent(artist+' '+title));
    if(!res.ok)return null;
    const d=await res.json();
    if(!d.results||!d.results.length)return null;
    const al=artist.toLowerCase(),tl=title.toLowerCase();
    let best=null,bestScore=-1;
    for(const r of d.results){
      const ra=(r.artistName||'').toLowerCase(),rc=(r.collectionName||'').toLowerCase();
      let score=0;
      if(rc.includes(tl)||tl.includes(rc))score+=2;
      if(ra.includes(al)||al.includes(ra))score+=2;
      if(score>bestScore){bestScore=score;best=r;}
    }
    if(best&&best.artworkUrl100)artCache[key]=best.artworkUrl100.replace('100x100bb','600x600bb');
  }catch(e){}
  return artCache[key];
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchResults=[],selectedIdx=null,searchMode='itunes';

async function searchItunes(){
  const q=document.getElementById('itunes-search').value.trim();
  if(!q)return;
  const btn=document.getElementById('search-btn');
  btn.textContent='…';btn.disabled=true;
  showPreview('<div class="msg"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div>Searching…</div>');
  let gotResults=false;
  try{
    const res=await fetch('/api/itunes?term='+encodeURIComponent(q));
    if(res.ok){
      const d=await res.json();
      if(d.results&&d.results.length){searchResults=d.results;searchMode='itunes';selectedIdx=null;renderPreviewItems();gotResults=true;}
    }
  }catch(e){}
  if(!gotResults){
    try{
      const parts=q.trim().split(' '),mid=Math.ceil(parts.length/2);
      const mbQuery=parts.length>1?'artist:"'+parts.slice(0,mid).join(' ')+'" AND release:"'+parts.slice(mid).join(' ')+'"':'release:"'+q+'"';
      const res=await fetch('https://musicbrainz.org/ws/2/release/?query='+encodeURIComponent(mbQuery)+'&fmt=json&limit=25',{headers:{'User-Agent':'VinylCollection/1.0 (vinyl@example.com)'}});
      const d=await res.json();
      const releases=(d.releases||[]).filter(r=>r.title&&r['artist-credit']&&r['artist-credit'].length);
      if(releases.length){searchResults=releases;searchMode='mb';selectedIdx=null;renderPreviewItems();gotResults=true;}
    }catch(e){}
  }
  if(!gotResults)showPreview('<div class="msg">No results — try different spelling or fill in manually.</div>');
  btn.textContent='Search';btn.disabled=false;
}

function showPreview(html){document.getElementById('preview-results').innerHTML=html;document.getElementById('preview-box').classList.add('visible');}
function cleanLabel(c){return c.replace(/^[©℗\s\d,]+/,'').trim().substring(0,40);}
function mbArtist(r){return(r['artist-credit']||[]).map(a=>a.artist?a.artist.name:a.name||'').filter(Boolean).join(', ');}

function renderPreviewItems(){
  document.getElementById('preview-results').innerHTML=searchResults.map((r,i)=>{
    let art='',title='',artist='',year='',meta='';
    if(searchMode==='itunes'){
      art=r.artworkUrl100||'';title=r.collectionName||'';artist=r.artistName||'';
      year=r.releaseDate?r.releaseDate.substring(0,4):'';
      meta=(year||'')+(r.primaryGenreName?' · '+r.primaryGenreName:'')+(r.copyright?' · '+cleanLabel(r.copyright):'');
    }else{
      title=r.title||'';artist=mbArtist(r);year=r.date?r.date.substring(0,4):'';
      const label=((r['label-info']||[]).map(l=>l.label?l.label.name:'').filter(Boolean)[0]||'').substring(0,40);
      const format=(r.media&&r.media[0])?r.media[0].format||'':'';
      meta=(year||'')+(label?' · '+label:'')+(format?' · '+format:'');
    }
    return'<div class="preview-item" id="pi-'+i+'" onclick="selectResult('+i+')">'+
      (art?'<img class="preview-art" src="'+esc(art)+'" loading="lazy"/>':'<div class="preview-art-placeholder">'+esc(initials(artist||'?'))+'</div>')+
      '<div class="preview-info"><div class="preview-title">'+esc(title)+'</div><div class="preview-sub">'+esc(artist)+'</div><div class="preview-meta">'+esc(meta)+'</div></div>'+
      '<div class="preview-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>'+
    '</div>';
  }).join('');
}

async function selectResult(i){
  if(selectedIdx!==null){const p=document.getElementById('pi-'+selectedIdx);if(p)p.classList.remove('selected');}
  selectedIdx=i;
  const el=document.getElementById('pi-'+i);if(el)el.classList.add('selected');
  const r=searchResults[i];if(!r)return;
  if(searchMode==='itunes'){
    document.getElementById('f-artist').value=r.artistName||'';
    document.getElementById('f-title').value=r.collectionName||'';
    document.getElementById('f-year').value=r.releaseDate?parseInt(r.releaseDate.substring(0,4)):'';
    document.getElementById('f-genre').value=r.primaryGenreName||'';
    document.getElementById('f-label').value=cleanLabel(r.copyright||'');
    if(r.artworkUrl100){
      const artUrl=r.artworkUrl100.replace('100x100bb','600x600bb');
      artCache[(r.artistName||'')+'||'+(r.collectionName||'')]=artUrl;
      document.getElementById('f-artwork-url').value=artUrl;
      resetArtUpload(artUrl);
    }
  }else{
    const artist=mbArtist(r),title=r.title||'';
    const year=r.date?parseInt(r.date.substring(0,4)):'';
    const label=((r['label-info']||[]).map(l=>l.label?l.label.name:'').filter(Boolean)[0]||'').substring(0,40);
    document.getElementById('f-artist').value=artist;
    document.getElementById('f-title').value=title;
    document.getElementById('f-year').value=year||'';
    document.getElementById('f-label').value=label;
    try{
      const ires=await fetch('/api/itunes?term='+encodeURIComponent(artist+' '+title));
      if(ires.ok){
        const id=await ires.json();
        if(id.results&&id.results.length){
          const al=artist.toLowerCase(),tl=title.toLowerCase();
          let best=null,bestScore=-1;
          for(const ir of id.results){
            const ra=(ir.artistName||'').toLowerCase(),rc=(ir.collectionName||'').toLowerCase();
            let score=0;if(rc.includes(tl)||tl.includes(rc))score+=2;if(ra.includes(al)||al.includes(ra))score+=2;
            if(score>bestScore){bestScore=score;best=ir;}
          }
          if(best){
            if(best.primaryGenreName)document.getElementById('f-genre').value=best.primaryGenreName;
            if(best.artworkUrl100){
              const artUrl=best.artworkUrl100.replace('100x100bb','600x600bb');
              artCache[artist+'||'+title]=artUrl;
              document.getElementById('f-artwork-url').value=artUrl;
              resetArtUpload(artUrl);
              const thumb=document.getElementById('pi-'+i);
              if(thumb){const ph=thumb.querySelector('.preview-art-placeholder');if(ph)ph.outerHTML='<img class="preview-art" src="'+esc(best.artworkUrl100)+'" loading="lazy"/>';}
            }
          }
        }
      }
    }catch(e){}
  }
  checkDuplicate();
}

// ── Scanner ───────────────────────────────────────────────────────────────────
let quaggaRunning=false;
async function openScanner(){
  document.getElementById('scanner-overlay').classList.add('open');
  document.getElementById('scanner-status').textContent='Starting camera…';
  if(typeof Quagga==='undefined'){
    await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});
  }
  Quagga.init({inputStream:{name:'Live',type:'LiveStream',target:document.getElementById('scanner-video'),constraints:{facingMode:'environment'}},decoder:{readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader']},locate:true},function(err){
    if(err){document.getElementById('scanner-status').textContent='Camera error: '+err.message;return;}
    Quagga.start();quaggaRunning=true;
    document.getElementById('scanner-status').textContent='Point camera at barcode';
  });
  Quagga.onDetected(async function(data){
    const barcode=data.codeResult.code;if(!barcode)return;
    closeScanner();await lookupBarcode(barcode);
  });
}
function closeScanner(){
  if(quaggaRunning){try{Quagga.stop();}catch(e){}quaggaRunning=false;}
  document.getElementById('scanner-overlay').classList.remove('open');
}
async function lookupBarcode(barcode){
  showPreview('<div class="msg"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div>Looking up barcode '+esc(barcode)+'…</div>');
  document.getElementById('preview-box').classList.add('visible');
  try{
    const res=await fetch('https://musicbrainz.org/ws/2/release/?query=barcode:'+encodeURIComponent(barcode)+'&fmt=json&limit=5',{headers:{'User-Agent':'VinylCollection/1.0 (vinyl@example.com)'}});
    const d=await res.json();
    if(d.releases&&d.releases.length){
      searchResults=d.releases.filter(r=>r.title&&r['artist-credit']&&r['artist-credit'].length);
      searchMode='mb';selectedIdx=null;
      if(searchResults.length){renderPreviewItems();await selectResult(0);return;}
    }
  }catch(e){}
  showPreview('<div class="msg">Barcode not found. Try searching by name above.</div>');
}

// ── Duplicate check ───────────────────────────────────────────────────────────
function checkDuplicate(){
  if(editingId)return;
  const artist=document.getElementById('f-artist').value.trim().toLowerCase();
  const title=document.getElementById('f-title').value.trim().toLowerCase();
  if(!artist||!title){hideDupAlert();return;}
  const match=records.find(r=>(r.artist||'').toLowerCase()===artist&&(r.title||'').toLowerCase()===title);
  if(match){
    document.getElementById('dup-msg').textContent='"'+match.title+'" by '+match.artist+' is already in your collection.';
    document.getElementById('dup-alert').classList.add('visible');
    document.getElementById('save-btn').textContent='Save anyway';
  }else{hideDupAlert();}
}
function hideDupAlert(){document.getElementById('dup-alert').classList.remove('visible');document.getElementById('save-btn').textContent='Save record';}

// ── Data ──────────────────────────────────────────────────────────────────────
let records=[],editingId=null;

function setStatus(ok,msg){
  document.getElementById('status-dot').className='status-dot '+(ok?'ok':'err');
  document.getElementById('status-text').textContent=msg;
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

async function loadRecords(){
  try{
    let all=[],offset='';
    do{
      const res=await fetch(AT_URL+'?pageSize=100'+(offset?'&offset='+offset:''),{headers:HEADERS});
      if(!res.ok){const t=await res.text();throw new Error(res.status+' '+t.substring(0,100));}
      const d=await res.json();
      all=all.concat((d.records||[]).map(r=>({id:r.id,createdTime:r.createdTime,...r.fields})));
      offset=d.offset||'';
    }while(offset);
    records=all;
    setStatus(true,'synced · '+records.length+' records');
    render();
  }catch(e){setStatus(false,'error: '+e.message);}
}

function discogsUrl(artist,title){return'https://www.discogs.com/search/?q='+encodeURIComponent(artist+' '+title)+'&type=release';}

function renderCard(r){
  const[bg,fg]=colorFor(r.artist||'');
  const key=(r.artist||'')+'||'+(r.title||'');
  if(r.artwork_url)artCache[key]=r.artwork_url;
  const cached=artCache[key];
  let artHtml;
  if(cached)artHtml='<img src="'+esc(cached)+'" alt="'+esc(r.title)+' cover" loading="lazy"/>';
  else if(cached===undefined)artHtml='<div class="art-spinner"><div class="spinner"></div></div>';
  else artHtml='<div class="art-placeholder" style="background:'+bg+';color:'+fg+'">'+esc(initials(r.artist||'?'))+'</div>';
  const tags=[r.genre,r.year,r.condition].filter(t=>t&&String(t).toLowerCase()!=='null');
  return'<div class="card" id="card-'+r.id+'">'+
    '<div class="art-wrap" id="art-'+r.id+'">'+artHtml+'</div>'+
    '<div class="card-body">'+
      '<div class="card-artist">'+esc(r.artist)+'</div>'+
      '<div class="card-title">'+esc(r.title)+'</div>'+
      (tags.length?'<div class="card-tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+
      (r.notes?'<div class="card-notes">'+esc(r.notes)+'</div>':'')+
      '<div class="card-links">'+
        '<a class="link-btn" href="'+discogsUrl(r.artist,r.title)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Liner notes</a>'+
        '<button class="link-btn" onclick="openModal(\''+r.id+'\')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>'+
        '<button class="del-btn" onclick="deleteRecord(\''+r.id+'\')" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function updateArtEl(r){
  const key=(r.artist||'')+'||'+(r.title||'');
  const el=document.getElementById('art-'+r.id);if(!el)return;
  const[bg,fg]=colorFor(r.artist||'');
  if(artCache[key])el.innerHTML='<img src="'+esc(artCache[key])+'" alt="'+esc(r.title)+' cover" loading="lazy"/>';
  else el.innerHTML='<div class="art-placeholder" style="background:'+bg+';color:'+fg+'">'+esc(initials(r.artist||'?'))+'</div>';
}

async function loadArtStaggered(list){
  for(let i=0;i<list.length;i++){
    const r=list[i];if(r.artwork_url)continue;
    const key=(r.artist||'')+'||'+(r.title||'');
    if(key in artCache){updateArtEl(r);continue;}
    await fetchArt(r.artist,r.title);updateArtEl(r);
    if(i<list.length-1)await new Promise(res=>setTimeout(res,120));
  }
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const genre=document.getElementById('filter-genre').value;
  const sort=document.getElementById('sort').value;
  let list=records.filter(r=>(((r.artist||'')+' '+(r.title||'')).toLowerCase().includes(q))&&(!genre||r.genre===genre));
  list.sort((a,b)=>{
    if(sort==='artist'){return sortKey(a.artist||'').localeCompare(sortKey(b.artist||''));}
    if(sort==='year')return(parseInt(a.year)||9999)-(parseInt(b.year)||9999);
    if(sort==='title')return(a.title||'').localeCompare(b.title||'');
    return new Date(a.createdTime||0)-new Date(b.createdTime||0);
  });
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>No records found.</div>';}
  else{grid.innerHTML=list.map(r=>renderCard(r)).join('');loadArtStaggered(list);}
  updateStats();updateGenreFilter();
}

function updateStats(){
  const t=records.length;
  document.getElementById('s-total').textContent=t;
  document.getElementById('s-artists').textContent=new Set(records.map(r=>r.artist)).size;
  document.getElementById('s-genres').textContent=new Set(records.filter(r=>r.genre).map(r=>r.genre)).size;
  const yrs=records.map(r=>parseInt(r.year)).filter(Boolean);
  document.getElementById('s-oldest').textContent=yrs.length?Math.min(...yrs):'—';
  document.getElementById('topbar-count').textContent=t+' record'+(t!==1?'s':'');
}

function updateGenreFilter(){
  const sel=document.getElementById('filter-genre'),cur=sel.value;
  const genres=[...new Set(records.filter(r=>r.genre).map(r=>r.genre))].sort();
  sel.innerHTML='<option value="">All genres</option>'+genres.map(g=>'<option'+(cur===g?' selected':'')+'>'+esc(g)+'</option>').join('');
  document.getElementById('genre-list').innerHTML=genres.map(g=>'<option value="'+esc(g)+'">').join('');
}

function openModal(id){
  editingId=id||null;
  const r=id?records.find(x=>x.id===id):null;
  document.getElementById('modal-heading').textContent=r?'Edit record':'Add a record';
  document.getElementById('search-section').style.display=r?'none':'block';
  document.getElementById('itunes-search').value='';
  document.getElementById('preview-box').classList.remove('visible');
  document.getElementById('preview-results').innerHTML='';
  hideDupAlert();searchResults=[];selectedIdx=null;
  ['artist','title','genre','label','notes'].forEach(f=>document.getElementById('f-'+f).value=r?(r[f]&&String(r[f]).toLowerCase()!=='null'?r[f]:''):'');
  const yearDisplay=r&&r.year&&String(r.year).toLowerCase()!=='null'?r.year:'';
  document.getElementById('f-year').value=yearDisplay;
  document.getElementById('f-condition').value=r?(r.condition||''):'';
  document.getElementById('f-artwork-url').value=r?(r.artwork_url||''):'';
  resetArtUpload(r?r.artwork_url:'');
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById(r?'f-artist':'itunes-search').focus(),60);
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}

async function saveRecord(){
  const artist=document.getElementById('f-artist').value.trim();
  const title=document.getElementById('f-title').value.trim();
  if(!artist||!title){alert('Artist and title are required.');return;}
  const artworkUrl=document.getElementById('f-artwork-url').value.trim()||null;
  const yearRaw=document.getElementById('f-year').value.trim();
  const yearVal=yearRaw&&yearRaw.toLowerCase()!=='null'?parseInt(yearRaw):NaN;
  const data={artist,title,genre:document.getElementById('f-genre').value.trim(),label:document.getElementById('f-label').value.trim(),condition:document.getElementById('f-condition').value,notes:document.getElementById('f-notes').value.trim(),artwork_url:artworkUrl};
  if(!isNaN(yearVal)&&yearVal>0)data.year=yearVal;
  try{
    // Remove null/empty fields — Airtable rejects nulls for some field types
    Object.keys(data).forEach(k=>{if(data[k]===null||data[k]==='')delete data[k];});
    console.log('Sending to Airtable:', JSON.stringify({fields:data}));
    let res;
    if(editingId){
      res=await fetch(AT_URL+'/'+editingId,{method:'PATCH',headers:HEADERS,body:JSON.stringify({fields:data})});
    }else{
      res=await fetch(AT_URL,{method:'POST',headers:HEADERS,body:JSON.stringify({records:[{fields:data}]})});
    }
    if(!res.ok){const errText=await res.text();console.error('Save error:',errText);throw new Error(errText);}
    toast(editingId?'Record updated':'Record added');
    closeModal();await loadRecords();
  }catch(e){alert('Error saving: '+e.message);}
}

async function deleteRecord(id){
  const r=records.find(x=>x.id===id);
  if(!r||!confirm('Remove "'+r.title+'" by '+r.artist+'?'))return;
  try{
    const res=await fetch(AT_URL+'/'+id,{method:'DELETE',headers:HEADERS});
    if(!res.ok)throw new Error(res.status);
    toast('Record removed');await loadRecords();
  }catch(e){alert('Error deleting: '+e.message);}
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeScanner();}});
loadRecords();
</script>
