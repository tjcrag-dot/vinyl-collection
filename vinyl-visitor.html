<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyl collection — pick something to play</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f4f0;--bg3:#eeecea;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9e9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--radius:8px;--radius-lg:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0efea;--text2:#a0a09a;--text3:#6a6a65;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
.hero{background:var(--bg);border-bottom:0.5px solid var(--border);padding:2rem 1.5rem 1.5rem;text-align:center}
.hero-icon{width:48px;height:48px;margin:0 auto 1rem}
.hero-icon svg{width:100%;height:100%}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-0.03em;margin-bottom:.4rem}
.hero p{font-size:15px;color:var(--text2);max-width:320px;margin:0 auto}
.page{max-width:900px;margin:0 auto;padding:1.5rem}
.controls{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none}
input,select{height:40px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:15px;font-family:inherit;padding:0 12px;outline:none;width:100%;transition:border-color 0.15s}
input:focus,select:focus{border-color:var(--text2)}
.search-wrap input{padding-left:36px;font-size:16px}
select{cursor:pointer;width:auto;min-width:130px}
.count{font-size:13px;color:var(--text3);margin-bottom:1rem}
.genre-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.chip{padding:5px 12px;border-radius:100px;border:0.5px solid var(--border2);background:none;font-size:13px;font-family:inherit;color:var(--text2);cursor:pointer;transition:all 0.12s}
.chip:hover{border-color:var(--text2);color:var(--text)}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.15s,transform 0.15s}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.art-wrap{width:100%;aspect-ratio:1;overflow:hidden;background:var(--bg3)}
.art-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.art-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;letter-spacing:-0.02em}
.art-spinner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card-body{padding:.75rem;flex:1;display:flex;flex-direction:column;gap:4px}
.card-artist{font-size:12px;color:var(--text2)}
.card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10px;padding:2px 6px;border-radius:100px;border:0.5px solid var(--border);color:var(--text2)}
.card-links{display:flex;gap:5px;margin-top:auto;padding-top:8px;border-top:0.5px solid var(--border)}
.link-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text2);text-decoration:none;padding:3px 6px;border-radius:5px;border:0.5px solid var(--border);background:none;transition:border-color 0.12s,color 0.12s;white-space:nowrap}
.link-btn:hover{border-color:var(--border2);color:var(--text)}
.link-btn svg{width:10px;height:10px;flex-shrink:0}
.empty{text-align:center;padding:4rem 1rem;color:var(--text2);font-size:14px}
.empty svg{width:36px;height:36px;display:block;margin:0 auto 12px;opacity:.3}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-icon">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="20"/><circle cx="24" cy="24" r="6"/><circle cx="24" cy="24" r="13" stroke-dasharray="3 3.5"/>
    </svg>
  </div>
  <h1>Pick something to play</h1>
  <p>Browse the collection and find a record to put on</p>
</div>

<div class="page">
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search artist or album…" oninput="render()"/>
    </div>
    <select id="sort" onchange="render()" style="width:auto;min-width:140px">
      <option value="artist">Artist A–Z</option>
      <option value="year">Year</option>
      <option value="title">Title A–Z</option>
    </select>
  </div>
  <div class="genre-chips" id="genre-chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const AT_KEY='patHK7bKT1HDK2kwF.0a39ee37e7eeaaa93bd7857a8942e6419e847629baa54b39064ccc9ddc62ba15';
const AT_BASE='appuSF82dazmDrlxb';
const AT_TABLE='records';
const AT_URL='https://api.airtable.com/v0/'+AT_BASE+'/'+encodeURIComponent(AT_TABLE);
const HEADERS={'Authorization':'Bearer '+AT_KEY};

const PALETTE=[['#dff0e8','#1a6645'],['#fde8c8','#7a3d0a'],['#dce8fb','#1a4d8f'],['#fce8e8','#8f1a1a'],['#ebe8fb','#3d1a8f'],['#e8f5e0','#2a6620'],['#fbf0e8','#7a5010'],['#f5e8fb','#6a1a7a'],['#e8fbf5','#1a6655'],['#fbfbe8','#5a5a10']];
function colorFor(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))&0xffff;return PALETTE[h%PALETTE.length];}
function initials(a){return a.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sortKey(a){return a.replace(/^The\s+/i,'');}

const artCache={};
async function fetchArt(artist,title){
  const key=artist+'||'+title;
  if(key in artCache)return artCache[key];
  artCache[key]=null;
  try{
    const res=await fetch('/api/itunes?term='+encodeURIComponent(artist+' '+title));
    if(!res.ok)return null;
    const d=await res.json();
    if(!d.results||!d.results.length)return null;
    const al=artist.toLowerCase(),tl=title.toLowerCase();
    let best=null,bestScore=-1;
    for(const r of d.results){
      const ra=(r.artistName||'').toLowerCase(),rc=(r.collectionName||'').toLowerCase();
      let score=0;
      if(rc.includes(tl)||tl.includes(rc))score+=2;
      if(ra.includes(al)||al.includes(ra))score+=2;
      if(score>bestScore){bestScore=score;best=r;}
    }
    if(best&&best.artworkUrl100)artCache[key]=best.artworkUrl100.replace('100x100bb','600x600bb');
  }catch(e){}
  return artCache[key];
}

let records=[],activeGenre='';

async function loadRecords(){
  try{
    let all=[],offset='';
    do{
      const res=await fetch(AT_URL+'?pageSize=100'+(offset?'&offset='+offset:''),{headers:HEADERS});
      const d=await res.json();
      all=all.concat((d.records||[]).map(r=>({id:r.id,createdTime:r.createdTime,...r.fields})));
      offset=d.offset||'';
    }while(offset);
    records=all;render();
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>Could not load collection.</div>';
  }
}

function discogsUrl(artist,title){return'https://www.discogs.com/search/?q='+encodeURIComponent(artist+' '+title)+'&type=release';}

function renderCard(r){
  const[bg,fg]=colorFor(r.artist||'');
  const key=(r.artist||'')+'||'+(r.title||'');
  if(r.artwork_url)artCache[key]=r.artwork_url;
  const cached=artCache[key];
  let artHtml;
  if(cached)artHtml='<img src="'+esc(cached)+'" alt="'+esc(r.title)+'" loading="lazy"/>';
  else if(cached===undefined)artHtml='<div class="art-spinner"><div class="spinner"></div></div>';
  else artHtml='<div class="art-placeholder" style="background:'+bg+';color:'+fg+'">'+esc(initials(r.artist||'?'))+'</div>';
  const tags=[r.genre,r.year].filter(Boolean);
  return'<div class="card" id="card-'+r.id+'">'+
    '<div class="art-wrap" id="art-'+r.id+'">'+artHtml+'</div>'+
    '<div class="card-body">'+
      '<div class="card-artist">'+esc(r.artist)+'</div>'+
      '<div class="card-title">'+esc(r.title)+'</div>'+
      (tags.length?'<div class="card-tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+
      '<div class="card-links">'+
        '<a class="link-btn" href="'+discogsUrl(r.artist,r.title)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Liner notes</a>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function updateArtEl(r){
  const key=(r.artist||'')+'||'+(r.title||'');
  const el=document.getElementById('art-'+r.id);if(!el)return;
  const[bg,fg]=colorFor(r.artist||'');
  if(artCache[key])el.innerHTML='<img src="'+esc(artCache[key])+'" alt="'+esc(r.title)+'" loading="lazy"/>';
  else el.innerHTML='<div class="art-placeholder" style="background:'+bg+';color:'+fg+'">'+esc(initials(r.artist||'?'))+'</div>';
}

async function loadArtStaggered(list){
  for(let i=0;i<list.length;i++){
    const r=list[i];if(r.artwork_url)continue;
    const key=(r.artist||'')+'||'+(r.title||'');
    if(key in artCache){updateArtEl(r);continue;}
    await fetchArt(r.artist,r.title);updateArtEl(r);
    if(i<list.length-1)await new Promise(res=>setTimeout(res,120));
  }
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  let list=records.filter(r=>(((r.artist||'')+' '+(r.title||'')).toLowerCase().includes(q))&&(!activeGenre||r.genre===activeGenre));
  list.sort((a,b)=>{
    if(sort==='artist')return sortKey(a.artist||'').localeCompare(sortKey(b.artist||''));
    if(sort==='year')return(parseInt(a.year)||9999)-(parseInt(b.year)||9999);
    return(a.title||'').localeCompare(b.title||'');
  });
  const genres=[...new Set(records.filter(r=>r.genre).map(r=>r.genre))].sort();
  document.getElementById('genre-chips').innerHTML=
    '<button class="chip'+(activeGenre===''?' active':'')+'" onclick="setGenre(\'\')">All</button>'+
    genres.map(g=>'<button class="chip'+(activeGenre===g?' active':'')+'" onclick="setGenre(\''+esc(g)+'\')">'+esc(g)+'</button>').join('');
  document.getElementById('count').textContent=list.length+' record'+(list.length!==1?'s':'')+(activeGenre?' · '+activeGenre:'');
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>Nothing found.</div>';}
  else{grid.innerHTML=list.map(r=>renderCard(r)).join('');loadArtStaggered(list);}
}

function setGenre(g){activeGenre=g;render();}
loadRecords();
</script>
</body>
</html>
