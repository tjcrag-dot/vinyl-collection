<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artists — Vinyl Collection</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f4f0;--bg3:#eeecea;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9e9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--radius:8px;--radius-lg:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0efea;--text2:#a0a09a;--text3:#6a6a65;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-0.02em;text-decoration:none}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);text-decoration:none;padding:5px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:none;cursor:pointer;transition:color 0.12s,border-color 0.12s;font-family:inherit}
.back-btn:hover{color:var(--text);border-color:var(--text2)}
.topbar-right{margin-left:auto;font-size:13px;color:var(--text2)}
.page{max-width:800px;margin:0 auto;padding:1.5rem}
.az-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1.5rem;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:.75rem}
.az-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;font-weight:500;font-family:inherit;border:none;background:none;cursor:pointer;color:var(--text3);transition:background 0.12s,color 0.12s}
.az-btn.has{color:var(--text);cursor:pointer}
.az-btn.has:hover{background:var(--bg3)}
.az-btn.active{background:var(--text);color:var(--bg)}
.search-wrap{position:relative;margin-bottom:1.5rem}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3);pointer-events:none}
.search-wrap input{width:100%;height:42px;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:15px;font-family:inherit;padding:0 12px 0 38px;outline:none}
.search-wrap input:focus{border-color:var(--text2)}
.letter-section{margin-bottom:1.5rem}
.letter-heading{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;padding:.5rem 0;border-bottom:0.5px solid var(--border);margin-bottom:.5rem}
.artist-row{display:flex;align-items:center;padding:.75rem .5rem;border-radius:var(--radius);cursor:pointer;transition:background 0.12s;color:var(--text)}
.artist-row:hover{background:var(--bg)}
.artist-name{font-size:15px;font-weight:500;flex:1}
.artist-genres{font-size:12px;color:var(--text2);margin-top:2px}
.artist-count{font-size:13px;color:var(--text3);padding-left:1rem;white-space:nowrap}
.empty-msg{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin 0.7s linear infinite;margin:3rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:100%;max-width:420px;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.panel-header{padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:1}
.panel-artist{font-size:18px;font-weight:600;letter-spacing:-0.01em;flex:1}
.panel-close{background:none;border:none;cursor:pointer;color:var(--text2);display:flex;padding:4px;border-radius:6px}
.panel-close:hover{background:var(--bg2)}
.panel-close svg{width:18px;height:18px}
.album-list{padding:1rem 1.5rem;display:flex;flex-direction:column;gap:10px}
.album-card{display:flex;align-items:center;gap:12px;padding:.75rem;border:0.5px solid var(--border);border-radius:var(--radius-lg);background:var(--bg2)}
.album-art{width:52px;height:52px;border-radius:6px;object-fit:cover;flex-shrink:0}
.album-art-placeholder{width:52px;height:52px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.album-info{flex:1;min-width:0}
.album-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.album-meta{font-size:12px;color:var(--text2);margin-top:2px}
.album-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:100px;border:0.5px solid var(--border);color:var(--text2)}
.play-btn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;font-family:inherit;color:var(--text2);background:none;border:0.5px solid var(--border2);border-radius:100px;padding:3px 9px;cursor:pointer;transition:all 0.12s}
.play-btn:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.play-btn svg{width:9px;height:9px}
.play-meta{font-size:11px;color:var(--text3);margin-top:3px}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="/vinyl-visitor.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
    Vinyl
  </a>
  <a class="back-btn" href="/vinyl-visitor.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Browse collection
  </a>
  <a href="/play-history.html" style="display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);text-decoration:none;padding:5px 10px;border-radius:var(--radius);border:0.5px solid var(--border2)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    History
  </a>
  <div class="topbar-right" id="count-label"></div>
</div>

<div class="page">
  <div class="az-bar" id="az-bar"></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search artists…" oninput="render()">
  </div>
  <div id="body"></div>
</div>

<div class="panel-overlay" id="overlay" onclick="if(event.target===this)closePanel()">
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-artist" id="panel-name"></div>
      <button class="panel-close" onclick="closePanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="album-list" id="panel-albums"></div>
  </div>
</div>

<script>
const KEY='patHK7bKT1HDK2kwF.0a39ee37e7eeaaa93bd7857a8942e6419e847629baa54b39064ccc9ddc62ba15';
const BASE='appuSF82dazmDrlxb';
const URL_='https://api.airtable.com/v0/'+BASE+'/records';
const LOG_URL='https://api.airtable.com/v0/'+BASE+'/play_log';
const H={'Authorization':'Bearer '+KEY};
const PALETTE=[['#dff0e8','#1a6645'],['#fde8c8','#7a3d0a'],['#dce8fb','#1a4d8f'],['#fce8e8','#8f1a1a'],['#ebe8fb','#3d1a8f'],['#e8f5e0','#2a6620'],['#fbf0e8','#7a5010'],['#f5e8fb','#6a1a7a'],['#e8fbf5','#1a6655'],['#fbfbe8','#5a5a10']];
function pal(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))&0xffff;return PALETTE[h%PALETTE.length];}
function ini(a){return a.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sortKey(a){return a.replace(/^The\s+/i,'');}
function notNull(v){return v&&String(v).toLowerCase()!=='null';}

let records=[], activeAz='';

async function load(){
  document.getElementById('body').innerHTML='<div class="spinner"></div>';
  let all=[],offset='';
  try{
    do{
      const r=await fetch(URL_+'?pageSize=100'+(offset?'&offset='+offset:''),{headers:H});
      const d=await r.json();
      all=all.concat((d.records||[]).map(r=>({id:r.id,...r.fields})));
      offset=d.offset||'';
    }while(offset);
    records=all;
    buildAz();
    render();
  }catch(e){
    document.getElementById('body').innerHTML='<div class="empty-msg">Could not load collection.</div>';
  }
}

function buildAz(){
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  const present=new Set(records.map(r=>{
    const ch=sortKey(r.artist||'').toUpperCase()[0];
    return /[A-Z]/.test(ch)?ch:'#';
  }));
  document.getElementById('az-bar').innerHTML=letters.map((l,i)=>`
    <button class="az-btn ${present.has(l)?'has':''}" onclick="${present.has(l)?`setAz('${l}')`:'void(0)'}">${l}</button>
  `).join('');
}

function setAz(l){
  activeAz=activeAz===l?'':l;
  document.getElementById('search').value='';
  document.querySelectorAll('.az-btn').forEach(b=>b.classList.remove('active'));
  if(activeAz){
    const idx=activeAz==='#'?26:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(activeAz);
    const btns=document.querySelectorAll('.az-btn');
    if(btns[idx])btns[idx].classList.add('active');
  }
  render();
  if(activeAz){
    const sec=document.getElementById('sec-'+activeAz);
    if(sec)setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'start'}),50);
  }
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const map={};
  records.forEach(r=>{
    const a=r.artist||'Unknown';
    if(!map[a])map[a]={albums:[],genres:new Set()};
    map[a].albums.push(r);
    if(notNull(r.genre))map[a].genres.add(r.genre);
  });
  let artists=Object.keys(map);
  if(q)artists=artists.filter(a=>a.toLowerCase().includes(q));
  if(activeAz&&!q){
    artists=artists.filter(a=>{
      const ch=sortKey(a).toUpperCase()[0];
      return activeAz==='#'?!/[A-Z]/.test(ch):ch===activeAz;
    });
  }
  artists.sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
  document.getElementById('count-label').textContent=artists.length+' artist'+(artists.length!==1?'s':'');
  if(!artists.length){
    document.getElementById('body').innerHTML='<div class="empty-msg">No artists found.</div>';
    return;
  }
  const sections={};
  artists.forEach(a=>{
    const ch=sortKey(a).toUpperCase()[0];
    const k=/[A-Z]/.test(ch)?ch:'#';
    if(!sections[k])sections[k]=[];
    sections[k].push(a);
  });
  document.getElementById('body').innerHTML=Object.keys(sections).sort().map(letter=>`
    <div class="letter-section" id="sec-${letter}">
      <div class="letter-heading">${letter}</div>
      ${sections[letter].map(artist=>{
        const info=map[artist];
        const count=info.albums.length;
        const genres=[...info.genres].slice(0,3).join(' · ');
        const safe=esc(artist).replace(/'/g,"\\'");
        return`<div class="artist-row" onclick="openPanel('${safe}')">
          <div style="flex:1">
            <div class="artist-name">${esc(artist)}</div>
            ${genres?`<div class="artist-genres">${esc(genres)}</div>`:''}
          </div>
          <div class="artist-count">${count} album${count!==1?'s':''}</div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

async function fetchArtwork(r){
  const q=encodeURIComponent(r.artist+' '+r.title);
  const urls=['/api/itunes?q='+q,'https://itunes.apple.com/search?term='+q+'&entity=album&limit=5'];
  for(const url of urls){
    try{
      const res=await fetch(url);
      const d=await res.json();
      const results=(d.results||[]).filter(x=>x.artworkUrl100);
      if(results.length){
        const match=results.find(x=>x.collectionName&&x.collectionName.toLowerCase().includes(r.title.toLowerCase()))||results[0];
        const art=match.artworkUrl100.replace('100x100bb','400x400bb');
        return art;
      }
    }catch(e){}
  }
  return null;
}

async function logPlay(r){
  const now=new Date().toISOString();
  const count=(parseInt(r.play_count)||0)+1;
  r.play_count=count;
  r.last_played=now;
  try{
    await fetch(URL_+'/'+r.id,{
      method:'PATCH',
      headers:{...H,'Content-Type':'application/json'},
      body:JSON.stringify({fields:{play_count:count,last_played:now}})
    });
  }catch(e){}
  try{
    await fetch(LOG_URL,{
      method:'POST',
      headers:{...H,'Content-Type':'application/json'},
      body:JSON.stringify({fields:{artist:r.artist,title:r.title,artwork_url:r.artwork_url||'',played_at:now}})
    });
  }catch(e){}
}

function fmtPlay(r){
  if(!r.play_count)return'';
  const count=r.play_count;
  const when=r.last_played?new Date(r.last_played).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  return`${count} play${count!==1?'s':''}${when?' · Last: '+when:''}`;
}

async function saveArtwork(id, url){
  try{
    await fetch(URL_+'/'+id,{
      method:'PATCH',
      headers:{...H,'Content-Type':'application/json'},
      body:JSON.stringify({fields:{artwork_url:url}})
    });
  }catch(e){}
}

function openPanel(artist){
  const list=records.filter(r=>r.artist===artist).sort((a,b)=>(parseInt(a.year)||9999)-(parseInt(b.year)||9999));
  const[bg,fg]=pal(artist);
  document.getElementById('panel-name').textContent=artist;
  document.getElementById('panel-albums').innerHTML=list.map(r=>{
    const art=notNull(r.artwork_url)
      ?`<img class="album-art" src="${esc(r.artwork_url)}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
      :'';
    const ph=`<div class="album-art-placeholder" style="background:${bg};color:${fg};${notNull(r.artwork_url)?'display:none':''}" id="ph-${r.id}">${esc(ini(artist))}</div>`;
    const tags=[r.year,r.genre,r.condition].filter(notNull);
    const playMeta=fmtPlay(r);
    return`<div class="album-card" id="card-${r.id}">
      ${art}${ph}
      <div class="album-info">
        <div class="album-title">${esc(r.title)}</div>
        ${notNull(r.label)?`<div class="album-meta">${esc(r.label)}</div>`:''}
        ${tags.length?`<div class="album-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
        <button class="play-btn" id="pbtn-${r.id}" onclick="handlePlay(event,'${r.id}')">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>Play
        </button>
        <div class="play-meta" id="pmeta-${r.id}">${playMeta}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('overlay').classList.add('open');

  list.filter(r=>!notNull(r.artwork_url)).forEach(async r=>{
    const url=await fetchArtwork(r);
    if(!url)return;
    r.artwork_url=url;
    const ph=document.getElementById('ph-'+r.id);
    if(ph){
      const img=document.createElement('img');
      img.className='album-art';
      img.src=url;
      img.loading='lazy';
      img.onerror=()=>{img.style.display='none';ph.style.display='flex';};
      ph.style.display='none';
      ph.parentNode.insertBefore(img,ph);
    }
    saveArtwork(r.id,url);
  });
  document.getElementById('panel').scrollTop=0;
}

async function handlePlay(e,id){
  e.stopPropagation();
  const r=records.find(x=>x.id===id);
  if(!r)return;
  const btn=document.getElementById('pbtn-'+id);
  if(btn){btn.textContent='✓ Played';btn.style.background='var(--text)';btn.style.color='var(--bg)';}
  await logPlay(r);
  const meta=document.getElementById('pmeta-'+id);
  if(meta)meta.textContent=fmtPlay(r);
}

function closePanel(){document.getElementById('overlay').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
load();
</script>
</body>
</html>
