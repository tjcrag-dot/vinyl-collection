<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play History — Vinyl Collection</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f4f0;--bg3:#eeecea;--text:#1a1a18;--text2:#6b6b67;--text3:#9e9e9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--radius:8px;--radius-lg:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0efea;--text2:#a0a09a;--text3:#6a6a65;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px;position:sticky;top:0;z-index:100}
.logo{font-size:17px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-0.02em;text-decoration:none}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);text-decoration:none;padding:5px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:none;cursor:pointer;transition:color 0.12s,border-color 0.12s}
.back-btn:hover{color:var(--text);border-color:var(--text2)}
.topbar-right{margin-left:auto;font-size:13px;color:var(--text2)}
.page{max-width:600px;margin:0 auto;padding:1.5rem}
.page-title{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:1.5rem}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin 0.7s linear infinite;margin:3rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:4rem 1rem;color:var(--text2);font-size:14px}
.day-group{margin-bottom:2rem}
.day-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;padding:.5rem 0;border-bottom:0.5px solid var(--border);margin-bottom:.75rem}
.play-row{display:flex;align-items:center;gap:12px;padding:.6rem .5rem;border-radius:var(--radius);transition:background 0.12s}
.play-row:hover{background:var(--bg)}
.play-art{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.play-art-ph{width:44px;height:44px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.play-info{flex:1;min-width:0}
.play-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-artist{font-size:12px;color:var(--text2);margin-top:1px}
.play-time{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.load-more{display:block;width:100%;padding:.75rem;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit;margin-top:1rem;transition:color 0.12s,border-color 0.12s}
.load-more:hover{color:var(--text);border-color:var(--text2)}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="/vinyl-visitor.html">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
    Vinyl
  </a>
  <a class="back-btn" href="/vinyl-visitor.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Browse
  </a>
  <div class="topbar-right" id="count-label"></div>
</div>

<div class="page">
  <div class="page-title">Play history</div>
  <div id="body"><div class="spinner"></div></div>
</div>

<script>
const KEY='patHK7bKT1HDK2kwF.0a39ee37e7eeaaa93bd7857a8942e6419e847629baa54b39064ccc9ddc62ba15';
const BASE='appuSF82dazmDrlxb';
const LOG_URL='https://api.airtable.com/v0/'+BASE+'/play_log';
const H={'Authorization':'Bearer '+KEY};

const PALETTE=[['#dff0e8','#1a6645'],['#fde8c8','#7a3d0a'],['#dce8fb','#1a4d8f'],['#fce8e8','#8f1a1a'],['#ebe8fb','#3d1a8f'],['#e8f5e0','#2a6620'],['#fbf0e8','#7a5010'],['#f5e8fb','#6a1a7a'],['#e8fbf5','#1a6655'],['#fbfbe8','#5a5a10']];
function pal(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))&0xffff;return PALETTE[h%PALETTE.length];}
function ini(a){return a.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function notNull(v){return v&&String(v).toLowerCase()!=='null';}

function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function fmtDay(iso){
  const d=new Date(iso);
  const today=new Date();
  const yesterday=new Date(today);yesterday.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString())return'Today';
  if(d.toDateString()===yesterday.toDateString())return'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

let allPlays=[],offset='',loading=false;

async function loadMore(){
  if(loading)return;
  loading=true;
  try{
    const url=LOG_URL+'?pageSize=100'+(offset?'&offset='+offset:'');
    const res=await fetch(url,{headers:H});
    const d=await res.json();
    const rows=(d.records||[]).map(r=>({id:r.id,...r.fields}));
    allPlays=allPlays.concat(rows);
    offset=d.offset||'';
    render(!!d.offset);
  }catch(e){
    document.getElementById('body').innerHTML='<div class="empty">Could not load play history.</div>';
  }
  loading=false;
}

function render(hasMore){
  const sorted=[...allPlays].sort((a,b)=>new Date(b.played_at)-new Date(a.played_at));
  document.getElementById('count-label').textContent=sorted.length+' play'+(sorted.length!==1?'s':'');

  if(!sorted.length){
    document.getElementById('body').innerHTML='<div class="empty">No plays yet — tap Play on any album.</div>';
    return;
  }

  const groups={};
  sorted.forEach(p=>{
    const day=fmtDay(p.played_at);
    if(!groups[day])groups[day]=[];
    groups[day].push(p);
  });

  let html=Object.keys(groups).map(day=>`
    <div class="day-group">
      <div class="day-label">${esc(day)}</div>
      ${groups[day].map(p=>{
        const[bg,fg]=pal(p.artist||'');
        const art=notNull(p.artwork_url)
          ?`<img class="play-art" src="${esc(p.artwork_url)}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
          :'';
        const ph=`<div class="play-art-ph" style="background:${bg};color:${fg};${notNull(p.artwork_url)?'display:none':''}">${esc(ini(p.artist||'?'))}</div>`;
        return`<div class="play-row">
          ${art}${ph}
          <div class="play-info">
            <div class="play-title">${esc(p.title)}</div>
            <div class="play-artist">${esc(p.artist)}</div>
          </div>
          <div class="play-time">${fmtTime(p.played_at)}</div>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  if(hasMore){
    html+=`<button class="load-more" onclick="loadMore()">Load more</button>`;
  }

  document.getElementById('body').innerHTML=html;
}

loadMore();
</script>
</body>
</html>
